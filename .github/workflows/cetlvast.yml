name: "CETLVaSt"

on:
  push: # Further filtering is done in the jobs.
  pull_request:
    branches:
      - main
      - "issue/*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      docs_ref:
        description: "Tag or commit to build the docs from instead of the dispatched ref. Set by release-docs."
        required: false
        default: ""

jobs:
  cache-warmup:
    if: >
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#verification') ||
      contains(github.event.head_commit.message, '#docs') ||
      contains(github.ref, '/main') ||
      contains(github.ref, '/issue/') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    container: ghcr.io/opencyphal/toolshed:ts26.4.5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.docs_ref }}
      - name: Cache ext modules
        id: cetlvast-ext
        uses: actions/cache@v6
        with:
          path: cetlvast/build_external
          key: build-external-${{ hashFiles('**/cetlvast/cmake/modules/ExternalDependencies*.cmake.in') }}-${{ hashFiles('**/cetlvast/cmake/modules/patches/*.patch') }}
      - name: simple-build-online
        working-directory: cetlvast
        if: steps.cetlvast-ext.outputs.cache-hit != 'true'
        run: cmake --workflow --preset manual-simple-workflow-online

  verification-amd64:
    # Skipped in the docs-only dispatch that release-docs starts.
    if: >
      !inputs.docs_ref && (
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#verification') ||
      contains(github.ref, '/main') ||
      contains(github.ref, '/issue/') ||
      (github.event_name == 'pull_request'))
    runs-on: ubuntu-latest
    container: ghcr.io/opencyphal/toolshed:ts26.4.5
    needs:
      - cache-warmup
    strategy:
      matrix:
        toolchain: ["gcc-native-32", "clang-native"]
        standard: ["cpp-14", "cpp-17", "cpp-20", "cpp-23"]
    steps:
      - uses: actions/checkout@v7
      - name: Cache ext modules
        uses: actions/cache@v6
        with:
          path: cetlvast/build_external
          key: build-external-${{ hashFiles('**/cetlvast/cmake/modules/ExternalDependencies*.cmake.in') }}-${{ hashFiles('**/cetlvast/cmake/modules/patches/*.patch') }}
          fail-on-cache-miss: true
      - name: run tests
        working-directory: cetlvast
        env:
          GTEST_COLOR: yes
        run: >
          cmake --workflow --preset workflow-${{ matrix.toolchain }}-${{ matrix.standard }}-offline
      - name: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.toolchain }}-${{ matrix.standard }}-amd64
          path: |
            cetlvast/build/compile_commands.json
            cetlvast/build/*/**/gcovr_html/*.*
          if-no-files-found: error

  verification-arm64:
    # Skipped in the docs-only dispatch that release-docs starts.
    if: >
      !inputs.docs_ref && (
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#verification') ||
      contains(github.ref, '/main') ||
      contains(github.ref, '/issue/') ||
      (github.event_name == 'pull_request'))
    runs-on: ubuntu-24.04-arm
    container: ghcr.io/opencyphal/toolshed:ts26.4.5
    needs:
      - cache-warmup
    strategy:
      matrix:
        toolchain: ["gcc-native", "clang-native"]
        standard: ["cpp-14", "cpp-17", "cpp-20"]
    steps:
      - uses: actions/checkout@v7
      - name: Cache ext modules
        uses: actions/cache@v6
        with:
          path: cetlvast/build_external
          key: build-external-${{ hashFiles('**/cetlvast/cmake/modules/ExternalDependencies*.cmake.in') }}-${{ hashFiles('**/cetlvast/cmake/modules/patches/*.patch') }}
          fail-on-cache-miss: true
      - name: run tests
        working-directory: cetlvast
        env:
          GTEST_COLOR: yes
        run: >
          cmake --workflow --preset workflow-${{ matrix.toolchain }}-${{ matrix.standard }}-offline
      - name: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.toolchain }}-${{ matrix.standard }}-arm64
          path: |
            cetlvast/build/compile_commands.json
            cetlvast/build/*/**/gcovr_html/*.*
          if-no-files-found: error

  # Compilers the current toolshed image no longer ships run here, in the last image that has them.
  verification-legacy-arm64:
    # Skipped in the docs-only dispatch that release-docs starts.
    if: >
      !inputs.docs_ref && (
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#verification') ||
      contains(github.ref, '/main') ||
      contains(github.ref, '/issue/') ||
      (github.event_name == 'pull_request'))
    runs-on: ubuntu-24.04-arm
    # ts26.4.x dropped g++-7. Keep this pinned to ts24.4.3 rather than following the other jobs.
    container: ghcr.io/opencyphal/toolshed:ts24.4.3
    needs:
      - cache-warmup
    strategy:
      matrix:
        # GCC 7 is still what much of the Arduino ecosystem ships (#149). It only supports C++14 here.
        toolchain: ["gcc7-native"]
        standard: ["cpp-14"]
    steps:
      - uses: actions/checkout@v7
      - name: Cache ext modules
        uses: actions/cache@v6
        with:
          path: cetlvast/build_external
          key: build-external-${{ hashFiles('**/cetlvast/cmake/modules/ExternalDependencies*.cmake.in') }}-${{ hashFiles('**/cetlvast/cmake/modules/patches/*.patch') }}
          fail-on-cache-miss: true
      - name: run tests
        working-directory: cetlvast
        env:
          GTEST_COLOR: yes
        run: >
          cmake --workflow --preset workflow-${{ matrix.toolchain }}-${{ matrix.standard }}-offline
      - name: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.toolchain }}-${{ matrix.standard }}-arm64
          path: |
            cetlvast/build/compile_commands.json
            cetlvast/build/*/**/gcovr_html/*.*
          if-no-files-found: error

  docs:
    if: >
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#docs') ||
      contains(github.ref, '/main') ||
      contains(github.ref, '/issue/') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    container: ghcr.io/opencyphal/toolshed:ts26.4.5
    needs:
      - cache-warmup
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.docs_ref }}
      - name: check-release-version
        if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          header=include/cetl/cetl.hpp
          major=$(sed -n 's/^#define CETL_VERSION_MAJOR \([0-9]*\)$/\1/p' "$header")
          minor=$(sed -n 's/^#define CETL_VERSION_MINOR \([0-9]*\)$/\1/p' "$header")
          patch=$(sed -n 's/^#define CETL_VERSION_PATCH \([0-9]*\)$/\1/p' "$header")
          if [ "$RELEASE_TAG" != "v$major.$minor.$patch" ]; then
            echo "::error file=$header::Release $RELEASE_TAG does not match CETL_VERSION_* in $header (v$major.$minor.$patch)."
            exit 1
          fi
      - name: Cache ext modules
        uses: actions/cache@v6
        with:
          path: cetlvast/build_external
          key: build-external-${{ hashFiles('**/cetlvast/cmake/modules/ExternalDependencies*.cmake.in') }}-${{ hashFiles('**/cetlvast/cmake/modules/patches/*.patch') }}
          fail-on-cache-miss: true
      - name: doc-gen-configure
        working-directory: cetlvast
        run: cmake --preset configure-gcc-native-cpp-14-offline
      - name: doc-gen-build
        working-directory: cetlvast/build
        run: ninja docs
      - name: Setup Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v6
      - name: Upload docs
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: "cetlvast/build/suites/docs/html/"

  # A release run's ref is its tag, which the github-pages environment does not allow to deploy. Instead, start a
  # dispatch run on main that builds the docs from the release tag and deploys them.
  release-docs:
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    needs:
      - docs
    permissions:
      actions: write # to dispatch this workflow
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >
          gh workflow run cetlvast.yml --repo "$GITHUB_REPOSITORY" --ref main -f docs_ref="$RELEASE_TAG"

  deploy-docs:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs:
      - docs
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      contents: read
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
