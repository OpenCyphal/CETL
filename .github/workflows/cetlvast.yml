name: "CETLVaSt"
run-name: CETLVaSt / ${{ inputs.docs_ref || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: cetlvast-${{ github.ref }}-${{ inputs.docs_ref }}
  cancel-in-progress: false

on:
  push: # Further filtering is done in the jobs.
  pull_request:
    branches:
      - main
      - "issue/*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      docs_ref:
        description: "Release tag to verify in full and deploy from main (stable releases only)."
        required: false
        default: ""

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.docs_ref || github.event.release.tag_name || github.sha }}
          fetch-depth: 0
      - name: Validate library and release versions
        id: version
        env:
          DOCS_REF: ${{ inputs.docs_ref }}
        run: |
          if [ -n "$DOCS_REF" ]; then
            python3 scripts/release_tools.py validate --tag "$DOCS_REF"
          else
            python3 scripts/release_tools.py validate
          fi

  release-tests:
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Test release tooling and rehearse in disposable Git repositories
        run: python3 -m unittest discover -s scripts/tests -v

  cache-warmup:
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#verification') ||
      contains(github.event.head_commit.message, '#docs') ||
      contains(github.ref, '/main') ||
      contains(github.ref, '/issue/') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    container: ghcr.io/opencyphal/toolshed:ts26.4.5
    needs: [version]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - name: Cache ext modules
        id: cetlvast-ext
        uses: actions/cache@v6
        with:
          path: cetlvast/build_external
          key: build-external-${{ hashFiles('**/cetlvast/cmake/modules/ExternalDependencies*.cmake.in') }}-${{ hashFiles('**/cetlvast/cmake/modules/patches/*.patch') }}
      - name: simple-build-online
        working-directory: cetlvast
        if: steps.cetlvast-ext.outputs.cache-hit != 'true'
        run: cmake --workflow --preset manual-simple-workflow-online

  verification-amd64:
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#verification') ||
      contains(github.ref, '/main') ||
      contains(github.ref, '/issue/') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    container: ghcr.io/opencyphal/toolshed:ts26.4.5
    needs:
      - cache-warmup
      - version
    strategy:
      matrix:
        toolchain: ["gcc-native-32", "clang-native"]
        standard: ["cpp-14", "cpp-17", "cpp-20", "cpp-23"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - name: Cache ext modules
        uses: actions/cache@v6
        with:
          path: cetlvast/build_external
          key: build-external-${{ hashFiles('**/cetlvast/cmake/modules/ExternalDependencies*.cmake.in') }}-${{ hashFiles('**/cetlvast/cmake/modules/patches/*.patch') }}
          fail-on-cache-miss: true
      - name: run tests
        working-directory: cetlvast
        env:
          GTEST_COLOR: yes
        run: >
          cmake --workflow --preset workflow-${{ matrix.toolchain }}-${{ matrix.standard }}-offline
      - name: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.toolchain }}-${{ matrix.standard }}-amd64
          path: |
            cetlvast/build/compile_commands.json
            cetlvast/build/*/**/gcovr_html/*.*
          if-no-files-found: error
          overwrite: true

  verification-arm64:
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#verification') ||
      contains(github.ref, '/main') ||
      contains(github.ref, '/issue/') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-24.04-arm
    container: ghcr.io/opencyphal/toolshed:ts26.4.5
    needs:
      - cache-warmup
      - version
    strategy:
      matrix:
        toolchain: ["gcc-native", "clang-native"]
        standard: ["cpp-14", "cpp-17", "cpp-20"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - name: Cache ext modules
        uses: actions/cache@v6
        with:
          path: cetlvast/build_external
          key: build-external-${{ hashFiles('**/cetlvast/cmake/modules/ExternalDependencies*.cmake.in') }}-${{ hashFiles('**/cetlvast/cmake/modules/patches/*.patch') }}
          fail-on-cache-miss: true
      - name: run tests
        working-directory: cetlvast
        env:
          GTEST_COLOR: yes
        run: >
          cmake --workflow --preset workflow-${{ matrix.toolchain }}-${{ matrix.standard }}-offline
      - name: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.toolchain }}-${{ matrix.standard }}-arm64
          path: |
            cetlvast/build/compile_commands.json
            cetlvast/build/*/**/gcovr_html/*.*
          if-no-files-found: error
          overwrite: true

  # Compilers the current toolshed image no longer ships run here, in the last image that has them.
  verification-legacy-arm64:
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#verification') ||
      contains(github.ref, '/main') ||
      contains(github.ref, '/issue/') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-24.04-arm
    # ts26.4.x dropped g++-7. Keep this pinned to ts24.4.3 rather than following the other jobs.
    container: ghcr.io/opencyphal/toolshed:ts24.4.3
    needs:
      - cache-warmup
      - version
    strategy:
      matrix:
        # GCC 7 is still what much of the Arduino ecosystem ships (#149). It only supports C++14 here.
        toolchain: ["gcc7-native"]
        standard: ["cpp-14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - name: Cache ext modules
        uses: actions/cache@v6
        with:
          path: cetlvast/build_external
          key: build-external-${{ hashFiles('**/cetlvast/cmake/modules/ExternalDependencies*.cmake.in') }}-${{ hashFiles('**/cetlvast/cmake/modules/patches/*.patch') }}
          fail-on-cache-miss: true
      - name: run tests
        working-directory: cetlvast
        env:
          GTEST_COLOR: yes
        run: >
          cmake --workflow --preset workflow-${{ matrix.toolchain }}-${{ matrix.standard }}-offline
      - name: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.toolchain }}-${{ matrix.standard }}-arm64
          path: |
            cetlvast/build/compile_commands.json
            cetlvast/build/*/**/gcovr_html/*.*
          if-no-files-found: error
          overwrite: true

  docs:
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#docs') ||
      contains(github.ref, '/main') ||
      contains(github.ref, '/issue/') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    container: ghcr.io/opencyphal/toolshed:ts26.4.5
    needs:
      - cache-warmup
      - version
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - name: Cache ext modules
        uses: actions/cache@v6
        with:
          path: cetlvast/build_external
          key: build-external-${{ hashFiles('**/cetlvast/cmake/modules/ExternalDependencies*.cmake.in') }}-${{ hashFiles('**/cetlvast/cmake/modules/patches/*.patch') }}
          fail-on-cache-miss: true
      - name: doc-gen-configure
        working-directory: cetlvast
        env:
          CETL_RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: cmake --preset configure-gcc-native-cpp-14-offline -DCETL_PROJECT_VERSION="$CETL_RELEASE_VERSION"
      - name: doc-gen-build
        working-directory: cetlvast/build
        run: ninja docs
      - name: Verify the version displayed by the built documentation
        env:
          CETL_RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: >-
          python3 scripts/release_tools.py verify-docs --version "$CETL_RELEASE_VERSION"
          --path cetlvast/build/suites/docs/html/index.html
      - name: Setup Pages
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        uses: actions/configure-pages@v6
      - name: Upload docs
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: "cetlvast/build/suites/docs/html/"

      - name: Save built release documentation
        uses: actions/upload-artifact@v7
        with:
          name: release-docs
          path: cetlvast/build/suites/docs/html/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  release-ready:
    if: >-
      always() && (
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#verification') ||
      contains(github.ref, '/main') ||
      contains(github.ref, '/issue/') ||
      github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    needs: [version, release-tests, cache-warmup, verification-amd64, verification-arm64, verification-legacy-arm64, docs]
    steps:
      - name: Require every release dependency to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required verification did not succeed: ' + ', '.join(failed))
          PYTHON

  release-assets:
    runs-on: ubuntu-latest
    needs: [version, release-ready]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-docs
          path: release-docs
      - name: Package the verified source, headers, and documentation
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
          LIBRARY_VERSION: ${{ needs.version.outputs.version }}
        run: |
          # PR/branch runs rehearse packaging using a local tag; it is never pushed.
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v$LIBRARY_VERSION-rc.$GITHUB_RUN_ID"
            git tag "$RELEASE_TAG" "$RELEASE_COMMIT"
          fi
          python3 scripts/release_tools.py package --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" \
            --docs release-docs --output release-bundle
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          version = json.loads(Path('release-bundle/release.json').read_text())['version']
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('PACKAGED_VERSION=' + version + '\n')
          PYTHON
      - name: Compile consumers using only the packaged headers
        run: |
          mkdir consumer
          tar -xzf "release-bundle/cetl-$PACKAGED_VERSION-headers.tar.gz" -C consumer
          cat > consumer/main.cpp <<'CPP'
          #include <cetl/pf17/optional.hpp>
          int main()
          {
              const cetl::pf17::optional<int> value{42};
              return value.value() == 42 ? 0 : 1;
          }
          CPP
          for standard in c++14 c++20; do
            c++ -std="$standard" -Wall -Wextra -Werror -pedantic \
              -I "consumer/cetl-$PACKAGED_VERSION/include" consumer/main.cpp -o consumer/test
            ./consumer/test
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: release-bundle/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  deploy-docs:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.version.outputs.tag != '' && needs.version.outputs.prerelease == 'false' }}
    needs: [version, release-ready, release-assets]
    concurrency:
      group: cetl-stable-pages
      cancel-in-progress: false
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      contents: read
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - name: Prevent unpublished releases or older retries from replacing stable docs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          PYTHONPATH: scripts
        run: |
          python3 - <<'PYTHON'
          import os
          from release import GitHub, require_latest_stable
          require_latest_stable(GitHub(os.environ['GITHUB_REPOSITORY']), os.environ['RELEASE_TAG'])
          PYTHON
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
